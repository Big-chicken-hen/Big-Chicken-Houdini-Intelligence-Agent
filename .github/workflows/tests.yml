name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        shell: pwsh
        run: |
          $compileTargets = @('src', 'services')
          $compileTargets += Get-ChildItem -LiteralPath houdini_package -Directory |
            Where-Object { $_.Name -match '^python(?:\d+\.\d+)?libs$' } |
            ForEach-Object { $_.FullName }
          python -B -m compileall -q @compileTargets
          if ($LASTEXITCODE -ne 0) {
            throw "Python compile failed with exit code $LASTEXITCODE"
          }

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $allParseErrors = @()
          Get-ChildItem -LiteralPath scripts -Recurse -File |
            Where-Object { $_.Extension -in '.ps1', '.psm1' } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseErrors
              )
              $allParseErrors += $parseErrors
            }
          if ($allParseErrors.Count -gt 0) {
            $allParseErrors | Format-List
            throw "PowerShell parse errors: $($allParseErrors.Count)"
          }

      - name: Prepare test runtime directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .runtime/tmp | Out-Null

      - name: Run standard-library tests
        shell: pwsh
        run: python -B -m unittest discover -s tests -t .
